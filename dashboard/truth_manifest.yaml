- id: prod01-catalogue-suggestions-sync
  scope: prod-01
  name: "root crontab: catalogue/suggestions/sync (0 7 * * *) — RETIRED"
  proves: "the daily catalogue-suggestions sync call to the local API returned a 2xx-shaped ok:true body, not that any suggestions were actually correct"
  notes: >
    Retired by PAT-1342 (2026-08-16): the crontab entry and its log file
    were removed from patched-prod-01. Root-caused as a compound failure —
    PAT-695 (2026-07-03) put session/Bearer auth in front of every
    /admin/* path and this cron's curl never sent an Authorization header,
    so it started 401ing; then PAT-852 (2026-07-13) removed the
    /admin/catalogue/suggestions/sync route from main.py entirely, replaced
    by the platform-side unified Approvals surface (see main.py's own
    comment above the catalogue/products proxies). The job ran orphaned and
    401ing for six weeks before PAT-1303's estate census caught it.
    Verbatim crontab entry as recorded before removal (`crontab -l` on
    patched-prod-01, 2026-08-16) — kept here so it is recoverable:
      # Notion tasks sync - daily at 09:00 UTC
      0 7 * * * curl -s -X POST http://localhost:8000/admin/catalogue/suggestions/sync >> /var/log/patched-catalogue-sync.log 2>&1
    The comment was wrong on two counts, not just the one the ticket named:
    it mislabelled the job "Notion tasks sync" (unrelated to what the line
    actually does) and mis-stated the fire time as 09:00 UTC when
    `0 7 * * *` fires at 07:00 UTC — confirmed against six weeks of log
    timestamps, all 07:00. Not repointed at the Approvals surface: PAT-852
    made the daily sync redundant by design (the platform now reads/writes
    review state directly, so there is nothing left for a local sync to
    reconcile), so removal rather than repair is correct.
  cadence_seconds: 86400
  stale_after_seconds: 172800
  evidence:
    kind: log_tail
    locator: /var/log/patched-catalogue-sync.log
    success_pattern: '"ok":true'
    failure_pattern: '"error"'
  retired:
    at: "2026-08-16"
    reason: >
      PAT-852 (2026-07-13) retired the /admin/catalogue/suggestions/sync
      route; PAT-1342 (2026-08-16) removed the orphaned root crontab entry
      and /var/log/patched-catalogue-sync.log from patched-prod-01. See
      notes above for the verbatim removed crontab line and full history.

