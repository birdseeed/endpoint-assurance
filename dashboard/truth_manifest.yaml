# truth_manifest.yaml — PAT-1303 declared inventory
#
# This file is the operational truth page's SOURCE OF WHAT SHOULD EXIST. It is
# never derived from what happens to report in — that is the exact failure
# this page exists to catch (PAT-1086: a LaunchDaemon listed in install.sh but
# never installed). Every entry here is joined against observed evidence
# (truth.py::collect_observation); an entry with no evidence renders amber,
# never green, and is never silently dropped from the page.
#
# Populated by a real read-only sweep on 2026-08-13:
#   - `systemctl list-timers --all` + unit-file inventory on patched-prod-01,
#     patched-api-01, patched-portal-01 (key-based SSH)
#   - root crontabs + /etc/cron.d on the same three boxes
#   - every .github/workflows/*.yml with a `schedule:` trigger in
#     ../updater and ../patched.im (none found with a schedule in
#     ../dashboard, ../portal; ../website has no workflows directory at all)
#   - AgentHealthStore (kind, subject) pairs in ../updater, both the Windows
#     C# side (windows/src/Service/AgentHealthStore.cs) and the macOS shell
#     side (macos/lib/agent_health.sh + the endpoint/ inlined copies)
#   - the LaunchDaemon plists endpoint/install.sh and macos/install.sh lay down
#   - this app's own `check_statuses` table (main.py)
#
# `proves` is deliberately narrow. Per the ticket brief: "signing a catalogue
# is not publishing it, publishing it is not verifying it, running a verifier
# is not comparing a hash." Write what success genuinely demonstrates.
#
# Required fields on every entry: id, scope, name, proves, cadence_seconds,
# stale_after_seconds, evidence.kind. evidence.locator is required for every
# kind except `absent` (which instead carries evidence.reason). See
# truth.py::load_manifest for the full validation rule set — a malformed
# entry is a loud error at load, never a silently skipped row.
#
# scope values in use: prod-01 | api-01 | portal-01 | tenant-zero |
#   github:updater | github:patched.im | agent:windows | agent:macos
#
# Optional `retired: {at, reason}` block (PAT-1342): mark a decommissioned
# job here instead of deleting its entry — deleting it would make it
# indistinguishable from a job that was never declared, the exact failure
# this page exists to catch. A retired entry renders its own "retired" state
# (never amber/red/green) and is excluded from evidence collection entirely.

