- id: prod01-email-delivery
  scope: prod-01
  name: "email_delivery (check_statuses row, PAT-1010)"
  proves: "outbound email is either genuinely deliverable or a deliberate, visible dry-run — not silently swallowed"
  notes: >
    PAT-1346 (2026-09-03): outbound email is now LIVE. EMAIL_DRY_RUN has been
    removed from /etc/patched-dashboard/dashboard.env and the deploy gate has
    been inverted in the same change: scripts/smoke/email_delivery.py (renamed
    from email_dry_run.py, since the old name asserted the opposite of what it
    now checks) FAILS THE DEPLOY, triggering PAT-909 auto-rollback, unless
    /api/smoke/health reports email_delivery == "live". It asserts "live"
    rather than "not dry-run" deliberately: with suppression off and no
    provider configured, every send would fail while a naive not-dry-run check
    still passed. Note the honest limit — "live" is configuration presence, not
    verified credentials; invalid keys read identically to good ones, so this
    hourly check_statuses row remains the runtime signal and the smoke gate is
    only the deploy-time one. Evidence for the switch: Microsoft Graph
    sendMail delivered end to end from prod-01 on 2026-09-03 to an external
    recipient and to Andy@patched.im (received 11:30:35Z, message-id
    PAXPR04MB9641E37E539F057A039CC76CCCB62), sent from a one-shot process so
    the service environment was untouched. Burst risk was assessed as empty
    rather than merely mitigated: 0 report_subscriptions, 0 calendly_leads,
    and all 3 clients rows had cert_digest_recipient unset, so there was no
    configured recipient to receive a stale send. That sits on top of
    PAT-1010's six rounds of hardening, which leave each call site's
    "already sent" state unmarked under dry-run so a real send fires once per
    naturally-due occurrence rather than once per missed period. Prior state,
    for anyone reading history: EMAIL_DRY_RUN=1 was structurally deliberate
    from PAT-228 and gated deploys from ~2026-07-17; it was never
    a stalled SPF/DKIM setup. Microsoft Graph is the sole configured sender;
    the former provider path was removed under PAT-1507.
    If suppression is ever reinstated, invert the smoke module in the SAME
    commit as the env change and rewrite this entry; a deploy gate that
    contradicts the intended state is worse than no gate.
  cadence_seconds: 3600
  stale_after_seconds: 10800
  evidence:
    kind: check_status
    locator: email_delivery

