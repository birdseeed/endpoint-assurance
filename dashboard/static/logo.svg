<text x="130" y="145" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="28" font-weight="400" fill="#4169E8" style="fill:rgb(65, 105, 232);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;JetBrains Mono&quot;, &quot;SF Mono&quot;, Menlo, monospace;font-size:28px;font-weight:400;text-anchor:start;dominant-baseline:auto">$ patched.im</text>
