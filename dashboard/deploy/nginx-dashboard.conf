# ─────────────────────────────────────────────────────────────────────────────
# dashboard.patched.im — nginx config
# ─────────────────────────────────────────────────────────────────────────────
# Production traffic flow:
#   browser → Cloudflare (terminates browser TLS, enforces CF Access policy)
#          → origin nginx on 443 (terminates origin-side TLS via the
#            Cloudflare Origin Cert installed at /etc/ssl/dashboard.patched.im.*)
#          → FastAPI on 127.0.0.1:8000
#
# Network filtering is layered, by design:
#   - Hetzner Cloud Firewall (deploy/hetzner-firewall-apply.sh) — primary
#     edge filter; only CF IPs can reach the box on 80/443 from the public
#     internet. UDP/41641 from anywhere for Tailscale direct-connect.
#   - UFW (host) — defence-in-depth; CF + tailnet on 80/443.
#   - Cloudflare Access — auth at the CF edge; only authorized humans pass.
#   - nginx — TLS termination + reverse proxy. NO IP allowlist here, because
#     the layers above already enforce it and an nginx-layer allowlist
#     breaks badly with real_ip_header (allow/deny evaluates the rewritten
#     $remote_addr, which is the browser IP, not the CF edge IP).
#
# We keep `set_real_ip_from` + `real_ip_header CF-Connecting-IP` purely for
# logging and application-visible client IPs. Trust list = CF ranges only.
# ─────────────────────────────────────────────────────────────────────────────

# Cloudflare IPv4 ranges — refresh from https://www.cloudflare.com/ips-v4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IPv6 ranges — refresh from https://www.cloudflare.com/ips-v6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# ── Port 80: redirect to HTTPS. Hetzner FW already blocks public-internet
#    traffic on 80 except from CF (and CF in Full Strict mode doesn't
#    initiate HTTP). Mainly for Tailscale admin paths or stray hits.
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.patched.im;

    return 301 https://$host$request_uri;
}

# ── Port 443: the real production listener.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2 ipv6only=on;
    server_name dashboard.patched.im;

    # Cloudflare Origin Certificate for dashboard.patched.im (15-year cert,
    # only trusted by Cloudflare's edge — exactly what we need for origin TLS).
    ssl_certificate     /etc/ssl/dashboard.patched.im.pem;
    ssl_certificate_key /etc/ssl/dashboard.patched.im.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for future use)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-running scan requests
        proxy_read_timeout 600;
        proxy_connect_timeout 60;
        proxy_send_timeout 600;
    }

    # Static files served direct (no proxy)
    location /static/ {
        alias /opt/patched-dashboard/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Old anonymous CVE-scan funnel (PAT-866) — routes retired from this app;
    # scan.patched.im is the byte-identical replacement. Path-preserving
    # redirect so old /public/* links keep working.
    location /public/ {
        return 301 https://scan.patched.im$request_uri;
    }
}
