<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ report_label }} | {{ tenant_name }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f3;color:#0f1115;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;background-color:#f5f5f3;">
<tr><td align="center" style="padding:16px 8px;">
<!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0"><tr><td><![endif]-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;table-layout:fixed;border-collapse:collapse;background-color:#ffffff;">
<tr><td style="padding:24px 20px 20px;border-top:4px solid #2563eb;overflow-wrap:anywhere;word-wrap:break-word;">
<table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;"><tr>
<td width="48" style="width:48px;padding-right:12px;"><img src="{{ brand_logo_url }}" alt="Patched" width="44" height="44" style="display:block;width:44px;height:44px;border:0;color:#0f172a;font-size:12px;"></td>
<td style="font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:bold;color:#0f172a;">Patched<span style="color:#f5530a;">.</span></td>
</tr></table>
<h1 style="margin:24px 0 8px;font-size:25px;line-height:1.25;font-weight:bold;color:#0f1115;">{{ report_label }}</h1>
<p style="margin:0;color:#334155;font-size:16px;font-weight:bold;">{{ tenant_name }}</p>
<p style="margin:4px 0 0;color:#475569;font-size:13px;">{{ period }}</p>
</td></tr>
<tr><td style="padding:0 20px 24px;overflow-wrap:anywhere;word-wrap:break-word;">
{% block content %}{% endblock %}
</td></tr>
<tr><td style="padding:16px 20px;background-color:#f8fafc;border-top:1px solid #e2e8f0;color:#475569;font-size:12px;overflow-wrap:anywhere;word-wrap:break-word;">
<p style="margin:0;">Patched | {{ tenant_name }}</p>
{% block footer %}{% endblock %}
</td></tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr></table>
</body>
</html>
