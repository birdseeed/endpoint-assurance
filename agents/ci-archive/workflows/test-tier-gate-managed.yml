name: test-tier-gate-managed

on:
  push:
    branches: [main]
    paths:
      - 'endpoint/patched-install.sh'
      - 'endpoint/patched-uninstall.sh'
      - 'endpoint/test-tier-gate-managed.zsh'
  pull_request:
    paths:
      - 'endpoint/patched-install.sh'
      - 'endpoint/patched-uninstall.sh'
      - 'endpoint/test-tier-gate-managed.zsh'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh (tier-gate managed-tier tests exercise a real zsh script)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run tier-gate managed-tier tests
        run: zsh endpoint/test-tier-gate-managed.zsh
