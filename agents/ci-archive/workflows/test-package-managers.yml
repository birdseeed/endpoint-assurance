name: test-package-managers

# PAT-2018: the npm global, pip user and pipx collector's contract tests,
# including the static guard that fails if the collector gains a package
# manager, runtime or other process launch or a network client, the drift
# guard that holds its file-safety helpers identical to ide_extensions.sh, the
# guard that pins the block on the wire (PAT-2225) while still exercising the
# off path, and its byte budget.

on:
  push:
    branches: [main]
    paths:
      - 'macos/lib/package_managers.sh'
      - 'macos/lib/test-package-managers.zsh'
      - 'macos/lib/ide_extensions.sh'
      - 'macos/lib/local_models.sh'
      - 'macos/lib/mcp_servers.sh'
      - 'macos/lib/browser_extensions.sh'
      - 'macos/lib/homebrew.sh'
      - 'macos/patched-collect.sh'
      - 'macos/lib/common.sh'
      - 'macos/lib/agent_health.sh'
      - 'macos/lib/tcc-deny-hook.zsh'
      - '.github/workflows/test-package-managers.yml'
  pull_request:
    paths:
      - 'macos/lib/package_managers.sh'
      - 'macos/lib/test-package-managers.zsh'
      - 'macos/lib/ide_extensions.sh'
      - 'macos/lib/local_models.sh'
      - 'macos/lib/mcp_servers.sh'
      - 'macos/lib/browser_extensions.sh'
      - 'macos/lib/homebrew.sh'
      - 'macos/patched-collect.sh'
      - 'macos/lib/common.sh'
      - 'macos/lib/agent_health.sh'
      - 'macos/lib/tcc-deny-hook.zsh'
      - '.github/workflows/test-package-managers.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh (the collector and its tests are zsh)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run package manager collector tests
        run: zsh macos/lib/test-package-managers.zsh
