name: agent-release-promote

# Manual, byte-preserving beta -> stable promotion. This workflow consumes an
# existing beta release asset and never runs a build.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to promote
        type: choice
        options: [macos, windows]
        required: true
      version:
        description: Exact four-part installable beta identity (X.Y.Z.N)
        required: true
        type: string
      expected_sha256:
        description: Expected SHA-256 from the beta release (lowercase hex)
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: release-gate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install metadata-signing dependency
        run: python3 -m pip install cryptography==50.0.1

      - name: Validate identity and resolve source asset
        id: release
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.([1-9][0-9]?)$ ]] || { echo 'version must be X.Y.Z.N with N=1..99' >&2; exit 1; }
          BASE="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          REVISION="${BASH_REMATCH[4]}"
          if [ "$PLATFORM" = windows ]; then
            [ "${BASH_REMATCH[1]}" -le 253 ] && [ "${BASH_REMATCH[2]}" -le 255 ] && [ "${BASH_REMATCH[3]}" -le 654 ] || { echo 'version exceeds Windows MSI-compatible beta bounds (253.255.654.99)' >&2; exit 1; }
          fi
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'expected_sha256 must be 64 lowercase hex characters' >&2; exit 1; }
          case "$PLATFORM" in
            macos) PREFIX=macos-agent; ASSET="patched-agent-macos-${VERSION}.tar.gz" ;;
            windows) PREFIX=windows-agent; ASSET="PatchedAgent-${VERSION}.msi" ;;
            *) echo 'unsupported platform' >&2; exit 1 ;;
          esac
          {
            echo "version=$VERSION"
            echo "platform=$PLATFORM"
            echo "prefix=$PREFIX"
            echo "beta_tag=${PREFIX}-v${BASE}-beta.${REVISION}"
            echo "stable_tag=${PREFIX}-v${VERSION}"
            echo "asset=$ASSET"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact beta release assets
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_TAG: ${{ steps.release.outputs.beta_tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          mkdir -m 700 incoming
          gh release download "$BETA_TAG" --pattern "$ASSET" --pattern SHA256SUMS --pattern "$ASSET.hmac" --dir incoming
          test -s "incoming/$ASSET" && test -s "incoming/SHA256SUMS" && test -s "incoming/$ASSET.hmac"

      - name: Verify downloaded bytes against expected SHA and HMAC
        env:
          ARTIFACT_SIGNING_KEY: ${{ secrets.ARTIFACT_SIGNING_KEY }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          ASSET: ${{ steps.release.outputs.asset }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_SIGNING_KEY" || { echo 'ARTIFACT_SIGNING_KEY is required' >&2; exit 1; }
          KEY_FILE="$RUNNER_TEMP/artifact-signing-key"
          trap 'rm -f "$KEY_FILE"' EXIT
          umask 077
          printf '%s' "$ARTIFACT_SIGNING_KEY" > "$KEY_FILE"
          ACTUAL_SHA256=$(sha256sum "incoming/$ASSET" | awk '{print $1}')
          [ "$ACTUAL_SHA256" = "$EXPECTED_SHA256" ] || { echo 'downloaded bytes do not match expected SHA-256' >&2; exit 1; }
          python3 tools/verify-agent-release.py --file "incoming/$ASSET" --sums incoming/SHA256SUMS --hmac "incoming/$ASSET.hmac" --key-file "$KEY_FILE"

      - name: Create stable-channel metadata signature
        env:
          ARTIFACT_METADATA_SIGNING_KEY: ${{ secrets.ARTIFACT_METADATA_SIGNING_KEY }}
          ARTIFACT_METADATA_SIGNING_KEY_ID: ${{ secrets.ARTIFACT_METADATA_SIGNING_KEY_ID }}
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          ADMIN_API_URL: ${{ vars.ADMIN_API_URL }}
          STABLE_TAG: ${{ steps.release.outputs.stable_tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_URL" || { echo 'ADMIN_API_URL is required' >&2; exit 1; }
          test -n "$ARTIFACT_METADATA_SIGNING_KEY" || { echo 'ARTIFACT_METADATA_SIGNING_KEY is required' >&2; exit 1; }
          test -n "$ARTIFACT_METADATA_SIGNING_KEY_ID" || { echo 'ARTIFACT_METADATA_SIGNING_KEY_ID is required' >&2; exit 1; }
          # Stable activation only follows a successful upload to this
          # authenticated, per-device store. GitHub Releases are publication
          # records and must never be the live agent delivery endpoint.
          ARTIFACT_URL="https://api.patched.im/v1/agent/artifact/download?platform=${PLATFORM}&channel=stable&version=${VERSION}"
          HMAC=$(tr -d '\r\n' < "incoming/$ASSET.hmac")
          ARTIFACT_URL="$ARTIFACT_URL" python3 -c "import json,os; p={'version':os.environ['VERSION'],'platform':os.environ['PLATFORM'],'channel':'stable','artifact_url':os.environ['ARTIFACT_URL'],'artifact_sha256':os.environ['EXPECTED_SHA256']}; open('stable-metadata.json','w').write(json.dumps(p,separators=(',',':'))+'\\n')"
          python3 verifier/sign-artifact-metadata.py \
            --input stable-metadata.json --key-env ARTIFACT_METADATA_SIGNING_KEY \
            --key-id "$ARTIFACT_METADATA_SIGNING_KEY_ID" --output stable-metadata.signed.json
          HMAC="$HMAC" python3 -c "import json,os; p=json.load(open('stable-metadata.json')); p.update({'platform':os.environ['PLATFORM'],'channel':'stable','version':os.environ['VERSION'],'artifact_sha256':os.environ['EXPECTED_SHA256'],'artifact_hmac':os.environ['HMAC']}); p['artifact_metadata_signature']=json.load(open('stable-metadata.signed.json')); p['released_by']='ci-github-actions-promotion'; json.dump(p,open('promote-request.json','w'),separators=(',',':'))"

      - name: Stage same bytes in a draft stable release
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ steps.release.outputs.stable_tag }}
          BETA_TAG: ${{ steps.release.outputs.beta_tag }}
          VERSION: ${{ inputs.version }}
          ASSET: ${{ steps.release.outputs.asset }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$BETA_TAG:refs/tags/$BETA_TAG"
          TARGET=$(git rev-parse "$BETA_TAG^{commit}")
          cp "incoming/$ASSET" .
          cp incoming/SHA256SUMS .
          cp "incoming/$ASSET.hmac" .
          # shellcheck disable=SC2016
          NOTES=$(printf 'Channel: stable. Promoted installable identity: %s. No rebuild; bytes copied from %s.\n\n**SHA-256:** `%s  %s`' "$VERSION" "$BETA_TAG" "$EXPECTED_SHA256" "$ASSET")
          if gh release view "$STABLE_TAG" >/dev/null 2>&1; then
            RELEASE_JSON=$(gh release view "$STABLE_TAG" --json isDraft,targetCommitish,assets)
            printf '%s' "$RELEASE_JSON" > stable-existing-release.json
            python3 - "$TARGET" "$ASSET" <<'PYEOF'
          import json, sys
          target, asset = sys.argv[1:]
          release = json.load(open("stable-existing-release.json"))
          if release.get("isDraft") is not True:
              raise SystemExit("existing stable release is public; refusing pre-gate retry")
          if release.get("targetCommitish") != target:
              raise SystemExit("existing stable draft target differs from beta tag commit")
          names = {item.get("name") for item in release.get("assets", [])}
          required = {asset, "SHA256SUMS", asset + ".hmac"}
          if not required.issubset(names):
              raise SystemExit("existing stable draft lacks required artifact, SHA256SUMS, or HMAC assets")
          PYEOF
            mkdir -m 700 stable-existing
            gh release download "$STABLE_TAG" --pattern "$ASSET" --pattern SHA256SUMS --pattern "$ASSET.hmac" --dir stable-existing
            EXISTING=$(sha256sum "stable-existing/$ASSET" | awk '{print $1}')
            [ "$EXISTING" = "$EXPECTED_SHA256" ] || { echo 'stable release already exists with different bytes' >&2; exit 1; }
            (cd stable-existing && sha256sum -c SHA256SUMS)
            cmp -s "incoming/$ASSET.hmac" "stable-existing/$ASSET.hmac" || { echo 'stable draft HMAC differs from verified beta asset' >&2; exit 1; }
          else
            gh release create "$STABLE_TAG" "$ASSET" SHA256SUMS "$ASSET.hmac" \
              --draft --target "$TARGET" --title "$PLATFORM agent $VERSION (stable promotion)" --notes "$NOTES"
          fi

      - name: Set up Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/box_key
          chmod 600 ~/.ssh/box_key

      - name: Upload stable bytes to authenticated artifact store
        env:
          ADMIN_API_URL: ${{ vars.ADMIN_API_URL }}
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ inputs.version }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_URL"
          PROD01_IP=$(sudo "$(command -v tailscale)" ip -4 patched-prod-01)
          REMOTE=$(mktemp "$RUNNER_TEMP/upload-remote.XXXXXX")
          trap 'rm -f "$REMOTE"' EXIT
          cat > "$REMOTE" <<'REMOTE_EOF'
          set -eu
          umask 0077
          BODY=$(mktemp); CFG=$(mktemp); RESP=$(mktemp)
          trap 'rm -f "$BODY" "$CFG" "$RESP"' EXIT
          cat > "$BODY"
          TOKEN=$(sed -n 's/^ADMIN_API_TOKEN=//p' /etc/patched-dashboard/dashboard.env | head -n 1 | tr -d '\r')
          case "$TOKEN" in \"*\") TOKEN=${TOKEN#\"}; TOKEN=${TOKEN%\"};; \'*\') TOKEN=${TOKEN#\'}; TOKEN=${TOKEN%\'};; esac
          case "$TOKEN" in *[!A-Za-z0-9._~-]*) exit 1;; esac
          printf 'url = "__URL__/admin/agent-versions/__PLATFORM__/stable/__VERSION__/artifact"\nrequest = "PUT"\nheader = "Content-Type: application/octet-stream"\nheader = "Authorization: Bearer %s"\ndata-binary = @%s\nsilent\nshow-error\ninsecure\n' "$TOKEN" "$BODY" > "$CFG"
          CODE=$(curl -K "$CFG" -o "$RESP" -w '%{http_code}')
          [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ] || { echo "stable byte upload failed: HTTP $CODE"; head -c 300 "$RESP"; exit 1; }
          REMOTE_EOF
          REMOTE_SCRIPT=$(<"$REMOTE")
          REMOTE_SCRIPT=${REMOTE_SCRIPT/__URL__/$ADMIN_API_URL}
          REMOTE_SCRIPT=${REMOTE_SCRIPT/__PLATFORM__/$PLATFORM}
          REMOTE_SCRIPT=${REMOTE_SCRIPT/__VERSION__/$VERSION}
          cat "incoming/$ASSET" | ssh -i ~/.ssh/box_key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes root@"$PROD01_IP" "$REMOTE_SCRIPT"

      - name: Call PAT-2004 promotion gate
        env:
          ADMIN_API_URL: ${{ vars.ADMIN_API_URL }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_URL"
          PROD01_IP=$(sudo "$(command -v tailscale)" ip -4 patched-prod-01)
          REMOTE=$(mktemp "$RUNNER_TEMP/promote-remote.XXXXXX")
          trap 'rm -f "$REMOTE"' EXIT
          cat > "$REMOTE" <<'REMOTE_EOF'
          set -eu
          umask 0077
          BODY=$(mktemp); CFG=$(mktemp); RESP=$(mktemp)
          trap 'rm -f "$BODY" "$CFG" "$RESP"' EXIT
          cat > "$BODY"
          TOKEN=$(sed -n 's/^ADMIN_API_TOKEN=//p' /etc/patched-dashboard/dashboard.env | head -n 1 | tr -d '\r')
          case "$TOKEN" in \"*\") TOKEN=${TOKEN#\"}; TOKEN=${TOKEN%\"};; \'*\') TOKEN=${TOKEN#\'}; TOKEN=${TOKEN%\'};; esac
          case "$TOKEN" in *[!A-Za-z0-9._~-]*) exit 1;; esac
          printf 'url = "__URL__/admin/agent-releases/promote"\nrequest = "POST"\nheader = "Content-Type: application/json"\nheader = "Authorization: Bearer %s"\ndata-binary = @%s\nsilent\nshow-error\ninsecure\n' "$TOKEN" "$BODY" > "$CFG"
          CODE=$(curl -K "$CFG" -o "$RESP" -w '%{http_code}')
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "PAT-2004 promotion refused: HTTP $CODE"
            head -c 1000 "$RESP" | LC_ALL=C tr -c '[:print:]' ' '
            exit 1
          fi
          cat "$RESP"
          REMOTE_EOF
          REMOTE_SCRIPT=$(<"$REMOTE")
          REMOTE_SCRIPT=${REMOTE_SCRIPT/__URL__/$ADMIN_API_URL}
          cat promote-request.json | ssh -i ~/.ssh/box_key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes root@"$PROD01_IP" "$REMOTE_SCRIPT"

      - name: Publish the gated stable release
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ steps.release.outputs.stable_tag }}
        run: |
          set -euo pipefail
          gh release edit "$STABLE_TAG" --draft=false
