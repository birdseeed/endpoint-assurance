name: test-updates

on:
  push:
    branches: [main]
    paths:
      - 'macos/lib/updates.sh'
      - 'macos/lib/common.sh'
      - 'macos/lib/test-updates.zsh'
  pull_request:
    paths:
      - 'macos/lib/updates.sh'
      - 'macos/lib/common.sh'
      - 'macos/lib/test-updates.zsh'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh (software update settings collector tests exercise a real zsh script)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run software update settings collector tests
        run: zsh macos/lib/test-updates.zsh
