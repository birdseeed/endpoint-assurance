name: test-audit-retention

on:
  push:
    branches: [main]
    paths:
      - 'macos/lib/auth.sh'
      - 'macos/lib/common.sh'
      - 'macos/lib/test-audit-retention.zsh'
  pull_request:
    paths:
      - 'macos/lib/auth.sh'
      - 'macos/lib/common.sh'
      - 'macos/lib/test-audit-retention.zsh'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh (audit retention collector tests exercise a real zsh script)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run audit retention collector tests
        run: zsh macos/lib/test-audit-retention.zsh
