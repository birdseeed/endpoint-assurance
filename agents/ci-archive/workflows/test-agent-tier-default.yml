name: test-agent-tier-default

on:
  push:
    branches: [main]
    paths:
      - 'endpoint/patched-update.sh'
      - 'endpoint/test-agent-tier-default.zsh'
      - 'endpoint/agent_config_tenant.py'
  pull_request:
    paths:
      - 'endpoint/patched-update.sh'
      - 'endpoint/test-agent-tier-default.zsh'
      - 'endpoint/agent_config_tenant.py'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh (agent-tier default test exercises a real zsh script)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run agent-tier default tests
        run: zsh endpoint/test-agent-tier-default.zsh
