name: test-per-app-policy

on:
  push:
    branches: [main]
    paths:
      - 'endpoint/patched-update.sh'
      - 'endpoint/test-per-app-policy.zsh'
      - 'endpoint/agent_config_tenant.py'
  pull_request:
    paths:
      - 'endpoint/patched-update.sh'
      - 'endpoint/test-per-app-policy.zsh'
      - 'endpoint/agent_config_tenant.py'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh (per-app update policy tests exercise a real zsh script)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run per-app update policy tests
        run: zsh endpoint/test-per-app-policy.zsh
