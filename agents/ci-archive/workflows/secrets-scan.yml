name: secrets-scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # Pinned SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz (from the release
          # checksums.txt). Verified before extracting so a compromised release
          # asset cannot inject a trojaned scanner binary into this job.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}" -o "$tarball"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xz -C /usr/local/bin -f "$tarball" gitleaks
          rm -f "$tarball"

      - name: Scan for secrets
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            gitleaks detect --source . \
              --log-opts "origin/${{ github.base_ref }}..HEAD" \
              --config .gitleaks.toml
          else
            gitleaks detect --source . \
              --log-opts "HEAD~1..HEAD" \
              --config .gitleaks.toml
          fi
