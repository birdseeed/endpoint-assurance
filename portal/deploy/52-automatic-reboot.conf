# PAT-990: standing weekly reboot window.
#
# unattended-upgrades already runs daily and installs security-only updates
# on this box (stock 50unattended-upgrades config, Allowed-Origins). What was
# missing was ever acting on a resulting reboot-required flag — the estate's
# boxes sat 34-47+ days with a reboot pending before this ticket, entirely
# because every reboot was a per-occasion human decision.
#
# Andy's ruling, 2026-08-02: unattended-upgrades handles the reboot itself,
# security-only, Sunday 03:00 — set here in the box's own local timezone
# (Europe/Isle_of_Man, see the box provisioning notes) rather than a fixed
# UTC offset, so "03:00" means what it says year-round instead of drifting
# an hour out during BST. This file only fires when /var/run/reboot-required
# already exists — a Sunday with nothing pending is a no-op.
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
Unattended-Upgrade::Automatic-Reboot-Time "03:00";
