# Patched customer portal - app.patched.im origin config.
# Installed to /etc/nginx/sites-available/app.patched.im by deploy/install.sh.
#
# Network filtering (CF-only origin) is enforced at the ufw layer, not here:
# real_ip_header CF-Connecting-IP rewrites $remote_addr to the browser IP
# before allow/deny would evaluate, which breaks nginx-level IP allowlists
# (same lesson as the dashboard box). set_real_ip_from below is purely so
# access logs show the real client IP.

server {
    listen 80;
    listen [::]:80;
    server_name app.patched.im;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.patched.im;

    # Cloudflare Origin Certificate (self-signed placeholder until installed;
    # see deploy/RUNBOOK.md step 5).
    ssl_certificate     /etc/ssl/app.patched.im.pem;
    ssl_certificate_key /etc/ssl/app.patched.im.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Log real client IPs (Cloudflare fronts everything).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Report downloads stream through the app; keep buffering off so large
    # PDFs do not spool to disk.
    proxy_buffering off;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        # Pass the CF Access JWT through untouched; the app verifies it.
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_read_timeout 60s;
    }
}
