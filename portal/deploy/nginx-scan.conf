# Patched public scan service - scan.patched.im origin config.
# Installed to /etc/nginx/sites-available/scan.patched.im by deploy/install-scan.sh.
#
# Network filtering (CF-only origin) is enforced at the ufw layer, not here:
# real_ip_header CF-Connecting-IP rewrites $remote_addr to the browser IP
# before allow/deny would evaluate, which breaks nginx-level IP allowlists
# (same lesson as the dashboard and portal boxes). set_real_ip_from below is
# purely so access logs show the real client IP.
#
# This service is PUBLIC by design (no Cloudflare Access in front): security is
# Turnstile + per-email/per-IP rate limits + OTP email verification + size caps,
# enforced in the app. Do not add a CF Access application over scan.patched.im.

server {
    listen 80;
    listen [::]:80;
    server_name scan.patched.im;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name scan.patched.im;

    # Cloudflare Origin Certificate (self-signed placeholder until installed;
    # see deploy/RUNBOOK-scan.md step 5).
    ssl_certificate     /etc/ssl/scan.patched.im.pem;
    ssl_certificate_key /etc/ssl/scan.patched.im.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Log real client IPs (Cloudflare fronts everything).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Report downloads stream through the app; keep buffering off so large
    # .docx files do not spool to disk. /public/scan accepts up to TWO files
    # (devices_file + apps_file), each up to PUBLIC_MAX_UPLOAD_BYTES (25 MB,
    # app-enforced) independently — a legitimate submission can be ~50 MB
    # combined before multipart overhead (PAT-891). Comfortably exceed 2x25MB
    # plus overhead rather than reject a submission nginx never should have
    # seen as oversized.
    proxy_buffering off;
    client_max_body_size 55m;

    # PAT-2593 write freeze: the waitlist moves to Cloudflare, so the two old
    # public write paths are closed here, before the final backup, and never
    # reach the app. Exact matches only; every method gets the same 503 and
    # the request body is discarded unread (no redirect, nothing reflected).
    # add_header in a location replaces the server-level set, so the three
    # security headers are repeated. Ordering and rollback:
    # deploy/RUNBOOK-scan.md "Waitlist cutover to Cloudflare".
    location = /public/waitlist {
        default_type text/html;
        charset utf-8;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header Retry-After 300 always;
        return 503 '<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Form unavailable</title>
</head>
<body>
<main>
<h1>This form address is unavailable</h1>
<p>Nothing was received here, so nothing you entered has been saved. Please return to <a href="https://patched.im/#waitlist">patched.im</a> and send the form again.</p>
</main>
</body>
</html>
';
    }

    location = /public/pricing-enquiry {
        default_type text/html;
        charset utf-8;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header Retry-After 300 always;
        return 503 '<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Form unavailable</title>
</head>
<body>
<main>
<h1>This form address is unavailable</h1>
<p>Nothing was received here, so nothing you entered has been saved. Please return to <a href="https://patched.im/#waitlist">patched.im</a> and send the form again.</p>
</main>
</body>
</html>
';
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 120s;
    }
}
